<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Haqqında | AzTU App</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #003566, #001d3d);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2em;
      color: #90e0ef;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1em;
      margin-bottom: 20px;
    }

    .info-box {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    .info-box p {
      margin: 10px 0;
    }

    a {
      color: #00b4d8;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 30px;
      font-size: 0.9em;
      color: #ccc;
    }

    /* Geri düyməsi */
    .back-button {
      background-color: #0077b6;
      color: white;
      padding: 10px 24px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background-color 0.3s ease;
    }

    .back-button:hover {
      background-color: #00b4d8;
    }
  </style>
</head>
<body>

  <button class="back-button" onclick="history.back()">← Geri</button>

  <h1>AzTU App - Haqqında</h1>

  <div class="info-box">
    <p><strong>Proqramın Adı:</strong> AzTU Rəsmi Tətbiqi</p>
    <p><strong>Versiya:</strong> 0.58 </p>
    <p><strong>Hazırlayan:</strong>  Appcreator (Elten Sabutov)</p>
    <p><strong>Haqqında:</strong> Bu tətbiq Azərbaycan Texniki Universitetinin tələbələri üçün hazırlanıb. Burada xəbər, əlaqə və tələbə məlumatları təqdim olunur.</p>
    <p><strong>Dəstək:</strong> <a href="mailto:appcreator@gmail.com">appcreator@gmail.com</a></p>
    
  </div>

  <footer>© 2025  Appcreator</footer>
</body>
</html>
